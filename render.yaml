services:
  - type: web
    name: cedossa
    runtime: python
    plan: free
    # Deploy from main (now holds the correct flat project structure).
    branch: main
    buildCommand: "./build.sh"
    startCommand: "waitress-serve --host=0.0.0.0 --port=$PORT cedossa.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "cedossa.onrender.com,.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: cedossa-db
          property: connectionString

databases:
  - name: cedossa-db
    plan: free
    databaseName: cedossa
    user: cedossa
