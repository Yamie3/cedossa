services:
  - type: web
    name: cedossa
    runtime: python
    plan: free
    # Deploy from main (now holds the correct flat project structure).
    branch: main
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --no-input && waitress-serve --host=0.0.0.0 --port=$PORT cedossa.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "cedossa.onrender.com,.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: cedossa-db
          property: connectionString
      # Set this in the Render dashboard with your Cloudinary account URL so
      # uploaded flyers/images persist (Render's own disk is ephemeral).
      - key: CLOUDINARY_URL
        sync: false
      # Admin user created automatically on deploy (set these in the dashboard).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: cedossa-db
    plan: free
    databaseName: cedossa
    user: cedossa
