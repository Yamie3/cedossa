{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found{% endblock %}

{% block content %}

<section class="bg-gray-50 min-h-[70vh] flex items-center justify-center py-20 px-6">
  <div class="text-center max-w-lg">
    <p class="text-8xl font-display font-bold text-brand-cyan mb-4">404</p>
    <h1 class="text-3xl font-display font-bold text-brand-navy mb-4">Page Not Found</h1>
    <p class="text-gray-600 mb-8">
      Sorry, the page you are looking for doesn't exist or has been moved.
    </p>
    <a href="{% url 'main:home' %}" class="btn btn-cyan"><i class="fas fa-home"></i> Back to Home</a>
  </div>
</section>

{% endblock %}
